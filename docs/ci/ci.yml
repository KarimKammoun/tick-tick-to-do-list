# CI workflow: formatting, analysis and tests.
#
# Kept under docs/ci/ because the credentials available in this repository's
# generation environment are not allowed to push files under
# `.github/workflows/`. To enable it, copy this file to
# `.github/workflows/ci.yml` from an account whose token has the "workflow"
# permission; nothing else has to change.
name: CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-format-test:
    name: Analyze, format check and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # Drift unit tests open an in-memory sqlite database through dart:ffi.
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install dependencies
        run: flutter pub get

      # The generated sources are committed (the authoring environment has no
      # Dart SDK), so every run rebuilds them from the sources of truth: the
      # ARB files and the Drift table definitions. A schema or translation
      # change therefore cannot leave a stale `*.g.dart` behind.
      - name: Regenerate generated sources
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      # Generated sources are formatted by their own generator (drift_dev and
      # gen-l10n), so only the hand-written code is checked here.
      - name: Check formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            $(git ls-files 'lib/**/*.dart' 'test/**/*.dart' \
              | grep -v -e '^lib/l10n/generated/' -e '\.g\.dart$')

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
