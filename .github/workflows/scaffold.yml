# TEMPORARY workflow - deleted at the end of step 0.
# The development sandbox has no Flutter SDK and cannot download it, so the
# platform folders (android/, windows/), the Drift code generation and the
# formatting are produced here, on GitHub Actions, and pushed back to the
# working branch.
name: Scaffold (temporary)

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write

jobs:
  scaffold:
    name: Generate platform folders, code and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Create platform folders (android + windows)
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp analysis_options.yaml /tmp/analysis_options.yaml.bak
          flutter create --platforms=android,windows --project-name taskflow --org com.taskflow .
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          cp /tmp/analysis_options.yaml.bak analysis_options.yaml
          rm -f test/widget_test.dart
          flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Drift code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze || true

      - name: Test
        run: flutter test || true

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: generate platform folders, Drift code and formatting" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload generated Dart code
        uses: actions/upload-artifact@v4
        with:
          name: generated-dart
          path: |
            lib/**/*.g.dart
            lib/l10n/generated/**
          if-no-files-found: warn
